name: Build APK

on:
  push:
    paths:
      - 'CDSPAdvanced-android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        working-directory: CDSPAdvanced-android
        run: |
          gradle wrapper --gradle-version 8.2

      - name: Build Release APK
        working-directory: CDSPAdvanced-android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CDSPAdvanced-v3.3
          path: CDSPAdvanced-android/app/build/outputs/apk/release/*.apk

      - name: Create APK zip
        working-directory: CDSPAdvanced-android
        run: |
          cd app/build/outputs/apk/release
          zip CDSPAdvanced-v3.3.zip *.apk

      - name: Upload APK zip
        uses: actions/upload-artifact@v4
        with:
          name: CDSPAdvanced-v3.3-zip
          path: CDSPAdvanced-android/app/build/outputs/apk/release/CDSPAdvanced-v3.3.zip
