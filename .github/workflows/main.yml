name: Build minidspd for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - name: Auto-fix compiler errors
        run: |
          cargo fix --lib -p minidsp --allow-dirty --allow-staged 2>/dev/null || true
          cargo clippy --fix -p minidsp --allow-dirty --allow-staged 2>/dev/null || true

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;25.2.9519653

      - name: Configure linker
        run: |
          NDK_LINKER="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << TOML
          [target.aarch64-linux-android]
          linker = "$NDK_LINKER"
          TOML

      - name: Build minidspd
        run: cargo build --release --target aarch64-linux-android --bin minidspd

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: minidspd-android-arm64
          path: target/aarch64-linux-android/release/minidspd
