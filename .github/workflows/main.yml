name: Build minidspd for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Patch websocket.rs - allow on containing function
        run: |
          python3 << 'PYEOF'
          with open('daemon/src/http/websocket.rs', 'r') as f:
              lines = f.readlines()

          print("=== ORIGINAL FILE ===")
          for i, l in enumerate(lines, 1):
              print(f"{i}: {l}", end='')

          # Find the line with .map(|msg| match msg {
          target_line = None
          for i, l in enumerate(lines):
              if '.map(|msg| match msg {' in l:
                  target_line = i
                  break

          if target_line is None:
              print("ERROR: target line not found!")
          else:
              print(f"\nFound target at line {target_line + 1}")
              # Walk backwards to find the fn definition
              fn_line = None
              for i in range(target_line, -1, -1):
                  if lines[i].strip().startswith('fn ') or lines[i].strip().startswith('pub fn ') or lines[i].strip().startswith('async fn ') or lines[i].strip().startswith('pub async fn '):
                      fn_line = i
                      break
              if fn_line is not None:
                  print(f"Found fn at line {fn_line + 1}: {lines[fn_line].rstrip()}")
                  # Insert allow before the fn
                  indent = len(lines[fn_line]) - len(lines[fn_line].lstrip())
                  allow = ' ' * indent + '#[allow(clippy::result_large_err)]\n'
                  lines.insert(fn_line, allow)
                  with open('daemon/src/http/websocket.rs', 'w') as f:
                      f.writelines(lines)
                  print("=== PATCHED FILE ===")
                  for i, l in enumerate(lines, 1):
                      print(f"{i}: {l}", end='')
              else:
                  print("ERROR: fn not found!")
          PYEOF

      - name: Patch other lint errors
        run: |
          for f in \
            minidsp/src/lib.rs \
            minidsp/src/transport/net/codec.rs \
            minidsp/src/formats/xml_config.rs \
            daemon/src/main.rs; do
            echo "#![allow(warnings, clippy::all)]" | cat - "$f" > /tmp/p && mv /tmp/p "$f"
          done

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;25.2.9519653

      - name: Configure linker
        run: |
          NDK_LINKER="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << TOML
          [target.aarch64-linux-android]
          linker = "$NDK_LINKER"
          TOML

      - name: Build minidspd
        run: cargo build --release --target aarch64-linux-android --bin minidspd

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: minidspd-android-arm64
          path: target/aarch64-linux-android/release/minidspd
