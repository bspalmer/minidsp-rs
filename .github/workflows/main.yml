name: Build minidspd for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Patch source to suppress new lints
        run: |
          # Prepend allow attributes to the three affected files
          for f in minidsp/src/lib.rs minidsp/src/transport/net/codec.rs minidsp/src/formats/xml_config.rs; do
            echo '#![allow(clippy::manual_is_multiple_of, mismatched_lifetime_syntaxes, clippy::all, warnings)]' | cat - "$f" > /tmp/patched && mv /tmp/patched "$f"
          done

      - name: Install Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;25.2.9519653

      - name: Configure linker
        run: |
          NDK_LINKER="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << TOML
          [target.aarch64-linux-android]
          linker = "$NDK_LINKER"
          TOML

      - name: Build minidspd
        run: cargo build --release --target aarch64-linux-android --bin minidspd

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: minidspd-android-arm64
          path: target/aarch64-linux-android/release/minidspd

