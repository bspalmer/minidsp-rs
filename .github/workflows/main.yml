name: Build minidspd for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Disable deny(warnings) in Cargo.toml files
        run: |
          # Remove deny(warnings) from all Cargo.toml files
          find . -name "Cargo.toml" -exec sed -i 's/deny(warnings)//g' {} \;
          find . -name "Cargo.toml" -exec sed -i 's/"deny_warnings"//g' {} \;
          # Add workspace-level lint allowance
          if grep -q '\[workspace\]' Cargo.toml; then
            echo '' >> Cargo.toml
            echo '[workspace.lints.clippy]' >> Cargo.toml
            echo 'all = "allow"' >> Cargo.toml
            echo '' >> Cargo.toml
            echo '[workspace.lints.rust]' >> Cargo.toml
            echo 'warnings = "allow"' >> Cargo.toml
          fi
          # Also fix the specific line in websocket.rs directly
          sed -i 's/Err(tungstenite::Error::ConnectionClosed)/Err(Box::new(tungstenite::Error::ConnectionClosed))/' daemon/src/http/websocket.rs || true

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;25.2.9519653

      - name: Configure linker
        run: |
          NDK_LINKER="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << TOML
          [target.aarch64-linux-android]
          linker = "$NDK_LINKER"
          TOML

      - name: Build minidspd
        env:
          RUSTFLAGS: "-Awarnings -Aclippy::all"
        run: cargo build --release --target aarch64-linux-android --bin minidspd

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: minidspd-android-arm64
          path: target/aarch64-linux-android/release/minidspd
