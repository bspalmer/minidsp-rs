name: Build minidspd for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show websocket.rs so we can see what we are patching
        run: cat daemon/src/http/websocket.rs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Patch websocket.rs with Python
        run: |
          python3 << 'PYEOF'
          import re

          with open('daemon/src/http/websocket.rs', 'r') as f:
              content = f.read()

          # Insert #[allow] before the .map( call on the offending line
          patched = content.replace(
              '.map(|msg| match msg {',
              '#[allow(clippy::result_large_err)]\n            .map(|msg| match msg {'
          )

          with open('daemon/src/http/websocket.rs', 'w') as f:
              f.write(patched)

          print("Patched websocket.rs:")
          print(open('daemon/src/http/websocket.rs').read())
          PYEOF

      - name: Patch other lint errors
        run: |
          for f in \
            minidsp/src/lib.rs \
            minidsp/src/transport/net/codec.rs \
            minidsp/src/formats/xml_config.rs \
            daemon/src/main.rs; do
            echo "#![allow(warnings, clippy::all)]" | cat - "$f" > /tmp/p && mv /tmp/p "$f"
          done

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;25.2.9519653

      - name: Configure linker
        run: |
          NDK_LINKER="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << TOML
          [target.aarch64-linux-android]
          linker = "$NDK_LINKER"
          TOML

      - name: Build minidspd
        run: cargo build --release --target aarch64-linux-android --bin minidspd

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: minidspd-android-arm64
          path: target/aarch64-linux-android/release/minidspd
        with:
          name: minidspd-android-arm64
          path: target/aarch64-linux-android/release/minidspd
